name: Feature request
description: Propose a focused tool or workflow improvement.
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: 'Include application versions, relevant official APIs, and expected tool inputs and results where known.'
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
